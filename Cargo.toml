[package]
name = "scenar"
version = "0.1.0"
edition = "2024"
description = "Un atelier d'écriture de scénario qui vérifie les setups et payoffs comme un compilateur."
license = "MIT"
publish = false

[workspace]
members = [".", "server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leptos = { version = "0.8", features = ["csr"] }
yrs = "0.28"
fastrand = "2"
base64 = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Blob", "BlobPropertyBag", "DataTransfer", "DomRect", "DragEvent", "Element",
  "File", "FileList", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement",
  "MediaQueryList", "Storage", "Url", "Window", "Document", "ScrollIntoViewOptions",
  "ScrollBehavior", "ScrollLogicalPosition", "WheelEvent", "DomTokenList", "KeyboardEvent",
  "HtmlTextAreaElement", "Location", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent",
  "Request", "RequestInit", "Response",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
